name: Release firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build release firmware
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-release-${{ hashFiles('platformio.ini', 'lib/**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Run native tests
        run: pio test -e native

      - name: Build both Nano targets
        run: |
          pio run -e nanoatmega328new
          pio run -e nanoatmega328

      - name: Prepare release artifacts
        run: |
          mkdir -p dist
          cp .pio/build/nanoatmega328new/firmware.hex dist/fm-quantizer-nano-new-bootloader.hex
          cp .pio/build/nanoatmega328new/firmware.elf dist/fm-quantizer-nano-new-bootloader.elf
          cp .pio/build/nanoatmega328/firmware.hex dist/fm-quantizer-nano-old-bootloader.hex
          cp .pio/build/nanoatmega328/firmware.elf dist/fm-quantizer-nano-old-bootloader.elf
          cp README.md LICENSE dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-firmware
          path: dist/

      - name: Publish GitHub release for tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "${GITHUB_REF_NAME}"
