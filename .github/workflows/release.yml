# Purpose: GitHub Actions automation for tagged FM Quantizer firmware releases.
# Author: Axel Napolitano
# Original FM Quantizer concept and Rust firmware: Quinn Freedman
# Copyright (C) 2026 Axel Napolitano
# SPDX-License-Identifier: GPL-3.0-or-later

name: Release firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build release firmware
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history and tags are required to generate the compare link to
          # the previous release.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-release-${{ hashFiles('platformio.ini', 'lib/**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Run native tests
        run: pio test -e native

      - name: Build both Nano targets
        run: |
          pio run -e nanoatmega328new
          pio run -e nanoatmega328

      - name: Prepare release artifacts
        run: |
          mkdir -p dist
          cp .pio/build/nanoatmega328new/firmware.hex dist/fm-quantizer-nano-new-bootloader.hex
          cp .pio/build/nanoatmega328new/firmware.elf dist/fm-quantizer-nano-new-bootloader.elf
          cp .pio/build/nanoatmega328/firmware.hex dist/fm-quantizer-nano-old-bootloader.hex
          cp .pio/build/nanoatmega328/firmware.elf dist/fm-quantizer-nano-old-bootloader.elf
          cp README.md LICENSE dist/

      - name: Generate release checksums
        working-directory: dist
        run: |
          sha256sum *.hex *.elf README.md LICENSE > SHA256SUMS.txt
          md5sum *.hex *.elf README.md LICENSE > MD5SUMS.txt
          cat SHA256SUMS.txt
          cat MD5SUMS.txt

      - name: Generate changelog-based release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          python scripts/generate_release_notes.py \
            --tag "${RELEASE_TAG}" \
            --previous-tag "${PREVIOUS_TAG}" \
            --repository "${REPOSITORY}" \
            --server-url "${SERVER_URL}" \
            > release-notes.md
          cat release-notes.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-firmware
          path: dist/

      - name: Publish GitHub release for tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --fail-on-no-commits \
            --notes-file release-notes.md \
            --title "${GITHUB_REF_NAME}"
