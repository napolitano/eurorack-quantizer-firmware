# Purpose: GitHub Actions automation for tagged FM Quantizer firmware releases.
# Author: Axel Napolitano
# Original FM Quantizer concept and Rust firmware: Quinn Freedman
# Copyright (C) 2026 Axel Napolitano
# SPDX-License-Identifier: GPL-3.0-or-later

name: Release firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build release firmware
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          # Full history and tags are required to generate the compare link to
          # the previous release.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'

      - name: Resolve firmware release version
        id: release_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(python -c 'import json; print(json.load(open("lib/fmq/library.json", encoding="utf-8"))["version"])')"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Firmware release version: ${VERSION}"

      - name: Select compatible user manual
        id: manual
        run: |
          python scripts/select_release_manual.py \
            --directory docs/manual \
            --firmware-version "${{ steps.release_version.outputs.version }}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Warn when no compatible user manual exists
        if: steps.manual.outputs.found != 'true'
        run: |
          echo "::warning title=User manual::No compatible quantizer-user-manual.X.Y.Z.odt (manual version <= firmware version) was found. The firmware release will continue without manual assets."

      - name: Cache PlatformIO
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-release-${{ hashFiles('platformio.ini', 'scripts/requirements-ci.txt', 'lib/**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core and coverage tooling
        run: python -m pip install -r scripts/requirements-ci.txt

      - name: Validate requirement traceability
        run: |
          python scripts/test_check_native_coverage.py
          python scripts/check_requirement_traceability.py
          python scripts/check_persistence_fixtures.py

      - name: Run native tests
        run: pio test -e native

      - name: Run native sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: pio test -e native_sanitized

      - name: Enforce native coverage policy
        run: |
          pio test -e native_coverage
          mkdir -p coverage
          gcovr --root . --filter lib/fmq/src --exclude test --xml-pretty --output coverage/coverage.xml
          python scripts/check_native_coverage.py coverage/coverage.xml

      - name: Build both Nano targets
        run: |
          pio run -e nanoatmega328new
          pio run -e nanoatmega328

      - name: Compile timing qualification image
        run: pio run -e nanoatmega328new_timing

      - name: Enforce AVR resource budgets
        run: |
          python scripts/check_avr_resource_budget.py .pio/build/nanoatmega328new/firmware.elf
          python scripts/check_avr_resource_budget.py .pio/build/nanoatmega328/firmware.elf

      - name: Install manual PDF tooling
        if: steps.manual.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-ubuntu

      - name: Prepare release artifacts
        run: |
          mkdir -p dist
          cp .pio/build/nanoatmega328new/firmware.hex dist/fm-quantizer-nano-new-bootloader.hex
          cp .pio/build/nanoatmega328new/firmware.elf dist/fm-quantizer-nano-new-bootloader.elf
          cp .pio/build/nanoatmega328/firmware.hex dist/fm-quantizer-nano-old-bootloader.hex
          cp .pio/build/nanoatmega328/firmware.elf dist/fm-quantizer-nano-old-bootloader.elf
          cp README.md LICENSE dist/
          python scripts/write_build_info.py --output dist/BUILD-INFO.txt --environment nanoatmega328new

      - name: Add user manual release assets
        if: steps.manual.outputs.found == 'true'
        env:
          MANUAL_PATH: ${{ steps.manual.outputs.path }}
          MANUAL_PDF_NAME: ${{ steps.manual.outputs.pdf_name }}
        run: |
          cp "${MANUAL_PATH}" dist/

          if libreoffice --headless --convert-to pdf --outdir dist "${MANUAL_PATH}"; then
            if [[ -s "dist/${MANUAL_PDF_NAME}" ]]; then
              echo "Generated PDF manual: dist/${MANUAL_PDF_NAME}"
            else
              rm -f "dist/${MANUAL_PDF_NAME}"
              echo "::warning title=User manual PDF::LibreOffice returned success but the expected PDF was not created. The ODT manual will still be released."
            fi
          else
            rm -f "dist/${MANUAL_PDF_NAME}"
            echo "::warning title=User manual PDF::LibreOffice could not export the selected manual to PDF. The ODT manual will still be released."
          fi

      - name: Generate release checksums
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f \
            ! -name 'SHA256SUMS.txt' \
            ! -name 'MD5SUMS.txt' \
            -printf '%f\n' | LC_ALL=C sort > /tmp/release-files.txt
          xargs -r sha256sum < /tmp/release-files.txt > SHA256SUMS.txt
          xargs -r md5sum < /tmp/release-files.txt > MD5SUMS.txt
          cat SHA256SUMS.txt
          cat MD5SUMS.txt

      - name: Generate changelog-based release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          python scripts/generate_release_notes.py \
            --tag "${RELEASE_TAG}" \
            --previous-tag "${PREVIOUS_TAG}" \
            --repository "${REPOSITORY}" \
            --server-url "${SERVER_URL}" \
            > release-notes.md
          cat release-notes.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-firmware
          path: dist/

      - name: Publish GitHub release for tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --fail-on-no-commits \
            --notes-file release-notes.md \
            --title "${GITHUB_REF_NAME}"
