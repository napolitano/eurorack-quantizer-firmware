name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'

      - name: Validate release tooling and metadata
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("lib/fmq/library.json", encoding="utf-8"))["version"])')"
          python scripts/test_select_release_manual.py
          python scripts/test_check_native_coverage.py
          python scripts/check_requirement_traceability.py
          python scripts/check_persistence_fixtures.py
          python scripts/select_release_manual.py \
            --directory docs/manual \
            --firmware-version "${VERSION}"
          python scripts/generate_release_notes.py \
            --tag "v${VERSION}" \
            --repository "${REPOSITORY}" \
            --server-url "${SERVER_URL}" \
            > /tmp/release-notes.md
          test -s /tmp/release-notes.md

  native-tests:
    name: Native / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite:
          - regression/test_hardware_ui
          - regression/test_quantizer
          - integration/test_arpeggiator_layer
          - integration/test_controls
          - integration/test_menu
          - integration/test_menu_shortcuts
          - integration/test_persistence
          - integration/test_persistence_faults
          - integration/test_persistence_golden
          - integration/test_eeprom_wear
          - integration/test_startup
          - system/test_arpeggiator_clock
          - system/test_channel_matrix
          - system/test_glide_trigger_matrix
          - system/test_sample_timing_matrix
          - system/test_signal_path
          - unit/test_brightness
          - unit/test_buttons
          - unit/test_crc
          - unit/test_pitch
          - unit/test_ladder_boundaries
          - unit/test_led_frame_matrix
          - unit/test_pitch_exhaustive
          - unit/test_quantizer_boundaries
          - unit/test_arpeggiator
          - unit/test_arpeggiator_channels
          - unit/test_ui_layer_gesture
          - unit/test_arpeggiator_matrix
          - unit/test_scale
          - unit/test_startup_sequence_store
          - unit/test_transposition_matrix
          - property/test_invariants
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'

      - name: Cache PlatformIO
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'scripts/requirements-ci.txt', 'lib/**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: python -m pip install -r scripts/requirements-ci.txt

      - name: Run ${{ matrix.suite }}
        run: pio test -e native -f ${{ matrix.suite }}


  native-coverage:
    name: Native coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'

      - name: Cache PlatformIO
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-coverage-${{ hashFiles('platformio.ini', 'scripts/requirements-ci.txt', 'lib/**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-coverage-
            ${{ runner.os }}-pio-

      - name: Install test tooling
        run: python -m pip install -r scripts/requirements-ci.txt

      - name: Run instrumented native tests
        run: pio test -e native_coverage

      - name: Generate coverage reports
        run: |
          mkdir -p coverage
          gcovr --root . --filter lib/fmq/src --exclude test --txt --output coverage/coverage.txt
          gcovr --root . --filter lib/fmq/src --exclude test --xml-pretty --output coverage/coverage.xml
          gcovr --root . --filter lib/fmq/src --exclude test --json-pretty --output coverage/coverage.json
          gcovr --root . --filter lib/fmq/src --exclude test --html-details --output coverage/coverage.html
          cat coverage/coverage.txt
          python scripts/check_native_coverage.py coverage/coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-coverage
          path: coverage/

  native-sanitizers:
    name: Native ASan / UBSan
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'

      - name: Cache PlatformIO
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-sanitized-${{ hashFiles('platformio.ini', 'scripts/requirements-ci.txt', 'lib/**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-sanitized-
            ${{ runner.os }}-pio-

      - name: Install pinned test tooling
        run: python -m pip install -r scripts/requirements-ci.txt

      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer suite
        run: pio test -e native_sanitized

  avr-timing-probe-build:
    name: AVR timing-probe build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'

      - name: Cache PlatformIO
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-timing-${{ hashFiles('platformio.ini', 'scripts/requirements-ci.txt', 'lib/**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-timing-
            ${{ runner.os }}-pio-

      - name: Install pinned PlatformIO Core
        run: python -m pip install -r scripts/requirements-ci.txt

      - name: Compile timing qualification image
        run: pio run -e nanoatmega328new_timing

  avr-build:
    name: AVR build (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment:
          - nanoatmega328new
          - nanoatmega328

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'

      - name: Cache PlatformIO
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'scripts/requirements-ci.txt', 'lib/**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.environment }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: python -m pip install -r scripts/requirements-ci.txt

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Enforce AVR resource budget
        run: python scripts/check_avr_resource_budget.py .pio/build/${{ matrix.environment }}/firmware.elf

      - name: Collect firmware artifacts
        run: |
          mkdir -p dist
          cp .pio/build/${{ matrix.environment }}/firmware.hex dist/fm-quantizer-${{ matrix.environment }}.hex
          cp .pio/build/${{ matrix.environment }}/firmware.elf dist/fm-quantizer-${{ matrix.environment }}.elf

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: firmware-${{ matrix.environment }}
          path: dist/
