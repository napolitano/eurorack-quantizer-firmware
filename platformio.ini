; PlatformIO project configuration for the FM Quantizer firmware.
;
; Environments:
;   nanoatmega328new  Arduino Nano with the newer bootloader (default)
;   nanoatmega328     Arduino Nano with the old bootloader (older clones)
;   native            Host build used to run the Unity unit tests
;   native_coverage   Host build with GCC/gcov coverage instrumentation
;   native_sanitized  Host build with ASan/UBSan
;   nanoatmega328new_timing  Non-release target timing qualification image
;
; Build & upload firmware:   pio run -e nanoatmega328new -t upload
; Run the unit tests:        pio test -e native
;
; Original Rust firmware (c) Quinn Freedman, GPL-3.0-or-later.
; C++ reimplementation (c) Axel Napolitano, GPL-3.0-or-later.

[platformio]
default_envs = nanoatmega328new

[env]
build_flags =
    -Ilib/fmq/include
lib_ldf_mode = deep+

; ---- Target firmware (Arduino Nano, ATmega328P @ 16 MHz) -------------------
[env:nanoatmega328new]
platform = atmelavr@5.3.0
board = nanoatmega328new
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -Isrc
    -Ilib/fmq/include
    -std=gnu++17
    -Wall
    -Wextra
monitor_speed = 115200

; Same board with the original (old) bootloader.
[env:nanoatmega328]
extends = env:nanoatmega328new
board = nanoatmega328

; ---- Host unit tests (no hardware required) --------------------------------
[env:native]
platform = native@1.2.1
test_framework = unity
extra_scripts = pre:scripts/platformio_strict_warnings.py
build_flags =
    ${env.build_flags}
    -Itest/support
    -std=c++17
    -Wall
    -Wextra
    -DUNITY_INCLUDE_DOUBLE


; ---- Host coverage ----------------------------------------------------------
; Generates gcov data for the portable firmware core. Intended for CI and
; local verification; it never affects AVR firmware builds.
[env:native_coverage]
extends = env:native
extra_scripts =
    pre:scripts/platformio_strict_warnings.py
    pre:scripts/platformio_coverage.py
build_flags =
    ${env:native.build_flags}
    -O0
    -g
    --coverage
build_unflags =
    -O1
    -O2
    -O3

; ---- Host sanitizers --------------------------------------------------------
; Runs the portable production core under AddressSanitizer and
; UndefinedBehaviorSanitizer. This environment is host-only and never affects
; AVR release artifacts.
[env:native_sanitized]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -O1
    -g
    -fno-omit-frame-pointer
    -fsanitize=address,undefined
    -fno-sanitize-recover=all

; ---- Target timing qualification -------------------------------------------
; Dedicated hardware-measurement build. D1/TX becomes a control-loop probe and
; serial diagnostics/calibration-console entry are disabled in this build.
; This environment is NEVER packaged as a release artifact.
[env:nanoatmega328new_timing]
extends = env:nanoatmega328new
build_flags =
    ${env.build_flags}
    -Isrc
    -Ilib/fmq/include
    -std=gnu++17
    -Wall
    -Wextra
    -DFMQ_TIMING_PROBE=1

