; PlatformIO project configuration for the FM Quantizer firmware.
;
; Environments:
;   nanoatmega328new  Arduino Nano with the newer bootloader (default)
;   nanoatmega328     Arduino Nano with the old bootloader (older clones)
;   native            Host build used to run the Unity unit tests
;
; Build & upload firmware:   pio run -e nanoatmega328new -t upload
; Run the unit tests:        pio test -e native
;
; Original Rust firmware (c) Quinn Freedman, GPL-3.0-or-later.
; C++ reimplementation (c) Axel Napolitano, GPL-3.0-or-later.

[platformio]
default_envs = nanoatmega328new

[env]
build_flags =
    -Ilib/fmq/include
lib_ldf_mode = deep+

; ---- Target firmware (Arduino Nano, ATmega328P @ 16 MHz) -------------------
[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -Isrc
    -Ilib/fmq/include
    -std=gnu++17
    -Wall
    -Wextra
monitor_speed = 115200

; Same board with the original (old) bootloader.
[env:nanoatmega328]
extends = env:nanoatmega328new
board = nanoatmega328

; ---- Host unit tests (no hardware required) --------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -Itest/support
    -std=c++17
    -Wall
    -Wextra
    -DUNITY_INCLUDE_DOUBLE
