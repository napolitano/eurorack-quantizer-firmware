f" stroke="#1F1F1F" stroke-width="4"/><text x="1020" y="694" text-anchor="middle" class="micro" font-weight="700">OUTPUT ADAPTER</text><circle cx="988" cy="725" r="10" fill="#fff" stroke="#1F1F1F" stroke-width="3"/><circle cx="988" cy="725" r="5" fill="#D94B3D"/><text x="988" y="748" text-anchor="middle" class="micro">TIP</text><circle cx="1052" cy="725" r="10" fill="#fff" stroke="#1F1F1F" stroke-width="3"/><circle cx="1052" cy="725" r="5" fill="#222"/><text x="1052" y="748" text-anchor="middle" class="micro">SLEEVE</text><circle cx="1020" cy="768" r="12" fill="#fff" stroke="#1F1F1F" stroke-width="3"/><circle cx="1020" cy="768" r="5" fill="#fff" stroke="#1F1F1F" stroke-width="2"/></g><path d="M708 732 C900 700 930 770 1020 768" class="blueStroke"/><path d="M1337 485 C1290 600 1180 690 988 725" class="blueStroke"/><path d="M1387 485 C1340 640 1220 730 1052 725" class="gndStroke"/><g><rect x="75" y="260" width="390" height="300" rx="18" class="softbox"/><text x="270" y="300" text-anchor="middle" class="label">Fast hardware acceptance</text><text x="105" y="350" class="small">1. C0 … C10 whole-volt sweep</text><text x="105" y="395" class="small">2. All 12 notes in octave 4</text><text x="105" y="440" class="small">3. Optional: all 121 targets</text><path d="M105 475H435" stroke="#D0D5D9" stroke-width="2"/><text x="105" y="512" class="small">1 semitone ≈ 83.333 mV</text><text x="105" y="542" class="small">1 mV error ≈ 1.2 cents</text></g><rect x="355" y="810" width="790" height="60" rx="14" fill="#E8F5FB" stroke="#1B9DD9" stroke-width="3"/><text x="750.0" y="837" text-anchor="middle" class="small" font-weight="700">Use CAL mode for final acceptance; use RAW mode for hardware diagnosis.</text><text x="750.0" y="859" text-anchor="middle" class="tiny">Example shown: C#4 target = 4.083333 V.</text></svg>
