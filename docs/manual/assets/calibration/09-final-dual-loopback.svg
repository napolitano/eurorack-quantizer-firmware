<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">Final dual-channel loopback verification</title><desc id="desc">Patch both output-to-input loops simultaneously, then press SAVE.</desc>
<rect width="1500" height="900" fill="#FFFFFF"/><style>
text{font-family:Ubuntu,Arial,sans-serif;fill:#1F1F1F}
.title{font-size:36px;font-weight:700} .subtitle{font-size:22px;fill:#666}
.label{font-size:24px;font-weight:600} .small{font-size:19px} .tiny{font-size:15px}
.micro{font-size:12px;letter-spacing:.04em} .muted{fill:#A8A8A8}
.mono{font-family:"Ubuntu Mono","DejaVu Sans Mono",monospace}
.box{fill:#fff;stroke:#1F1F1F;stroke-width:4} .softbox{fill:#F5F6F7;stroke:#D7DADD;stroke-width:3}
.device{fill:#F5F6F7;stroke:#1F1F1F;stroke-width:5} .deviceInner{fill:#fff;stroke:#B8BDC2;stroke-width:2.5}
.blueStroke{stroke:#1B9DD9;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.gndStroke{stroke:#4E5458;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.patch{stroke:#1B9DD9;stroke-width:11;fill:none;stroke-linecap:round;stroke-linejoin:round}
.patchB{stroke:#D94B3D;stroke-width:11;fill:none;stroke-linecap:round;stroke-linejoin:round}
.action{stroke:#F28C28;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.guide{stroke:#C8CDD2;stroke-width:3;fill:none;stroke-dasharray:10 10}
.callout{fill:#fff;stroke:#D5D9DD;stroke-width:2.5}
</style>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1F1F1F"/></marker>
<marker id="orangeArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#F28C28"/></marker>
</defs><text x="60" y="58" class="title">Final dual-channel loopback verification</text><text x="60" y="90" class="subtitle">Patch both output-to-input loops simultaneously, then press SAVE.</text><g><rect x="590" y="105" width="320" height="710" rx="16" fill="#FAFAFA" stroke="#1F1F1F" stroke-width="5"/><circle cx="612" cy="127" r="8" fill="#fff" stroke="#1F1F1F" stroke-width="3"/><circle cx="888" cy="127" r="8" fill="#fff" stroke="#1F1F1F" stroke-width="3"/><circle cx="612" cy="793" r="8" fill="#fff" stroke="#1F1F1F" stroke-width="3"/><circle cx="888" cy="793" r="8" fill="#fff" stroke="#1F1F1F" stroke-width="3"/><text x="750.0" y="163" text-anchor="middle" font-size="38" font-weight="600">Quantizer</text><circle cx="750.0" cy="225.0" r="22" fill="#fff" stroke="#1F1F1F" stroke-width="3.5"/><text x="750.0" y="231.0" text-anchor="middle" class="tiny" font-weight="600">C</text><circle cx="802.5" cy="239.1" r="22" fill="#fff" stroke="#1F1F1F" stroke-width="3.5"/><text x="802.5" y="245.1" text-anchor="middle" class="tiny" font-weight="600">C#</text><circle cx="840.9" cy="277.5" r="22" fill="#fff" stroke="#1F1F1F" stroke-width="3.5"/><text x="840.9" y="283.5" text-anchor="middle" class="tiny" font-weight="600">D</text><circle cx="855.0" cy="330.0" r="22" fill="#fff" stroke="#1F1F1F" stroke-width="3.5"/><text x="855.0" y="336.0" text-anchor="middle" class="tiny" font-weight="600">D#</text><circle cx="840.9" cy="382.5" r="22" fill="#fff" stroke="#1F1F1F" stroke-width="3.5"/><text x="840.9" y="388.5" text-anchor="middle" class="tiny" font-weight="600">E</text><circle cx="802.5" cy="420.9" r="22" fill="#fff" stroke="#1F1F1F" stroke-width="3.5"/><text x="802.5" y="426.9" text-anchor="middle" class="tiny" font-weight="600">F</text><circle cx="750.0" cy="435.0" r="22" fill="#fff" stroke="#1F1F1F" stroke-width="3.5"/><text x="750.0" y="441.0" text-anchor="middle" class="tiny" font-weight="600">F#</text><circle cx="697.5" cy="420.9" r="22" fill="#fff" stroke="#1F1F1F" stroke-width="3.5"/><text x="697.5" y="426.9" text-anchor="middle" class="tiny" font-weight="600">G</text><circle cx="659.1" cy="382.5" r="22" fill="#fff" stroke="#1F1F1F" stroke-width="3.5"/><text x="659.1" y="388.5" text-anchor="middle" class="tiny" font-weight="600">G#</text><circle cx="645.0" cy="330.0" r="22" fill="#fff" stroke="#1F1F1F" stroke-width="3.5"/><text x="645.0" y="336.0" text-anchor="middle" class="tiny" font-weight="600">A</text><circle cx="659.1" cy="277.5" r="22" fill="#fff" stroke="#1F1F1F" stroke-width="3.5"/><text x="659.1" y="283.5" text-anchor="middle" class="tiny" font-weight="600">A#</text><circle cx="697.5" cy="239.1" r="22" fill="#fff" stroke="#1F1F1F" stroke-width="3.5"/><text x="697.5" y="245.1" text-anchor="middle" class="tiny" font-weight="600">B</text><circle cx="750.0" cy="330" r="35" fill="none" stroke="#D9D9D9" stroke-width="4" stroke-dasharray="65 30"/><circle cx="670" cy="510" r="25" fill="#fff" stroke="#1F1F1F" stroke-width="4"/><text x="670" y="558" text-anchor="middle" class="tiny" font-weight="600">SHIFT</text><circle cx="770" cy="510" r="25" fill="#fff" stroke="#1F1F1F" stroke-width="4"/><text x="770" y="558" text-anchor="middle" class="tiny" font-weight="600">LOAD</text><circle cx="840" cy="510" r="25" fill="#fff" stroke="#1F1F1F" stroke-width="4"/><text x="840" y="558" text-anchor="middle" class="tiny" font-weight="600">SAVE</text><rect x="620" y="600" width="120" height="160" rx="10" fill="#fff" stroke="#D6D6D6" stroke-width="2.5"/><text x="680" y="628" text-anchor="middle" class="small" font-weight="700">CHANNEL A</text><circle cx="645" cy="650" r="8" fill="#2FA45A" opacity="0.25"/><circle cx="715" cy="650" r="8" fill="#2FA45A" opacity="0.25"/><circle cx="652" cy="684" r="17" fill="#fff" stroke="#1B9DD9" stroke-width="5"/><circle cx="652" cy="684" r="6" fill="#fff" stroke="#1B9DD9" stroke-width="4"/><text x="652" y="715" text-anchor="middle" class="micro">V/OCT</text><circle cx="708" cy="684" r="17" fill="#fff" stroke="#1F1F1F" stroke-width="3"/><circle cx="708" cy="684" r="6" fill="#fff" stroke="#1F1F1F" stroke-width="2"/><text x="708" y="715" text-anchor="middle" class="micro">SAMPLE</text><circle cx="652" cy="732" r="17" fill="#fff" stroke="#1F1F1F" stroke-width="3"/><circle cx="652" cy="732" r="6" fill="#fff" stroke="#1F1F1F" stroke-width="2"/><text x="652" y="763" text-anchor="middle" class="micro">TRIG</text><circle cx="708" cy="732" r="17" fill="#fff" stroke="#1B9DD9" stroke-width="5"/><circle cx="708" cy="732" r="6" fill="#fff" stroke="#1B9DD9" stroke-width="4"/><text x="708" y="763" text-anchor="middle" class="micro">OUT</text><rect x="760" y="600" width="120" height="160" rx="10" fill="#fff" stroke="#D6D6D6" stroke-width="2.5"/><text x="820" y="628" text-anchor="middle" class="small" font-weight="700">CHANNEL B</text><circle cx="785" cy="650" r="8" fill="#D94B3D" opacity="0.25"/><circle cx="855" cy="650" r="8" fill="#D94B3D" opacity="0.25"/><circle cx="792" cy="684" r="17" fill="#fff" stroke="#1B9DD9" stroke-width="5"/><circle cx="792" cy="684" r="6" fill="#fff" stroke="#1B9DD9" stroke-width="4"/><text x="792" y="715" text-anchor="middle" class="micro">V/OCT</text><circle cx="848" cy="684" r="17" fill="#fff" stroke="#1F1F1F" stroke-width="3"/><circle cx="848" cy="684" r="6" fill="#fff" stroke="#1F1F1F" stroke-width="2"/><text x="848" y="715" text-anchor="middle" class="micro">SAMPLE</text><circle cx="792" cy="732" r="17" fill="#fff" stroke="#1F1F1F" stroke-width="3"/><circle cx="792" cy="732" r="6" fill="#fff" stroke="#1F1F1F" stroke-width="2"/><text x="792" y="763" text-anchor="middle" class="micro">TRIG</text><circle cx="848" cy="732" r="17" fill="#fff" stroke="#1B9DD9" stroke-width="5"/><circle cx="848" cy="732" r="6" fill="#fff" stroke="#1B9DD9" stroke-width="4"/><text x="848" y="763" text-anchor="middle" class="micro">OUT</text><text x="750.0" y="802" text-anchor="middle" class="tiny muted">1 V/Oct · 0–10 V</text></g><path d="M708 732 C520 775 515 570 652 684" class="patch"/><path d="M848 732 C980 775 985 570 792 684" class="patchB"/><g><circle cx="130" cy="340" r="22" fill="#2FA45A"/><text x="130" y="347" text-anchor="middle" class="small" font-weight="700" style="fill:#fff">1</text><text x="168" y="347" class="small">OUT A → V/OCT A</text></g><g><circle cx="1100" cy="340" r="22" fill="#D94B3D"/><text x="1100" y="347" text-anchor="middle" class="small" font-weight="700" style="fill:#fff">2</text><text x="1138" y="347" class="small">OUT B → V/OCT B</text></g><rect x="355" y="810" width="790" height="60" rx="14" fill="#E8F5FB" stroke="#1B9DD9" stroke-width="3"/><text x="750.0" y="837" text-anchor="middle" class="small" font-weight="700">Both IN/OUT pairs must blink before you confirm.</text><text x="750.0" y="859" text-anchor="middle" class="tiny">A complete PASS commits the profile and qualification metadata.</text></svg>
