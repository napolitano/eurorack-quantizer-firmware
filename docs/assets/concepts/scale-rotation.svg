<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">Scale rotation</title>
<desc id="desc">A seven-note scale is rotated upward by one semitone, wrapping around the twelve pitch classes.</desc>
<rect width="960" height="430" fill="#FFFFFF"/>
<style>
