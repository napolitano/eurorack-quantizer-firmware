<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">Absolute and relative Channel B</title>
<desc id="desc">Absolute mode quantizes only CV B. Relative mode sums CV A and CV B before Channel B quantization.</desc>
<rect width="960" height="450" fill="#FFFFFF"/>
<style>
text{font-family:Ubuntu,Arial,sans-serif;fill:#1F1F1F} .label{font-size:28px;font-weight:600}.small{font-size:22px}.tiny{font-size:18px}.muted{fill:#A8A8A8}.blue{fill:#1B9DD9}.orange{fill:#F28C28}.green{fill:#2FA45A}.red{fill:#D94B3D}.axis{stroke:#1F1F1F;stroke-width:5;fill:none}.grid{stroke:#E7E7E7;stroke-width:3;stroke-dasharray:10 12}.ref{stroke:#A8A8A8;stroke-width:6;stroke-dasharray:14 12;fill:none}.signal{stroke:#1B9DD9;stroke-width:8;fill:none;stroke-linejoin:round;stroke-linecap:round}.orangeStroke{stroke:#F28C28;stroke-width:6;fill:none}.box{fill:#FFFFFF;stroke:#1F1F1F;stroke-width:5}.softbox{fill:#E8F5FB;stroke:#1B9DD9;stroke-width:5}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1F1F1F"/></marker><marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1B9DD9"/></marker></defs>
<text x="65" y="100" class="label">Absolute B</text><text x="540" y="100" class="label">Relative B</text>
<rect x="55" y="135" width="360" height="220" rx="22" class="box"/><rect x="530" y="135" width="375" height="220" rx="22" class="box"/>
<text x="90" y="210" class="small">CV B</text><path d="M165 202H250" stroke="#1F1F1F" stroke-width="5" marker-end="url(#arrow)"/><rect x="255" y="165" width="125" height="80" rx="16" class="softbox"/><text x="317" y="214" text-anchor="middle" class="small">Quantize B</text>
<text x="560" y="188" class="small">CV A</text><text x="560" y="290" class="small">CV B</text><path d="M635 180H700V230" stroke="#1F1F1F" stroke-width="5" fill="none"/><path d="M635 282H700V230" stroke="#1F1F1F" stroke-width="5" fill="none"/><circle cx="720" cy="230" r="35" fill="#FFFFFF" stroke="#1B9DD9" stroke-width="5"/><text x="720" y="242" text-anchor="middle" class="label blue">+</text><path d="M755 230H790" stroke="#1F1F1F" stroke-width="5" marker-end="url(#arrow)"/><rect x="795" y="190" width="95" height="80" rx="16" class="softbox"/><text x="842" y="220" text-anchor="middle" class="tiny">Quantize</text><text x="842" y="244" text-anchor="middle" class="tiny">B</text>


</svg>